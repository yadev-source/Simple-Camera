name: Build Simple-Camera APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate dummy keystore for CI
        run: |
          keytool -genkey -v -keystore /tmp/dummy.jks -storepass android -alias android -keypass android -keyalg RSA -validity 1000 -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US"
          echo "storeFile=/tmp/dummy.jks" > keystore.properties
          echo "storePassword=android" >> keystore.properties
          echo "keyAlias=android" >> keystore.properties
          echo "keyPassword=android" >> keystore.properties
          cat keystore.properties
          ls -lh /tmp/dummy.jks

      - name: Build Debug
        run: ./gradlew app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Camera-debug
          path: app/build/outputs/apk/debug/app-debug.apk