name: Build Simple-Camera APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Fix keystore properties
        run: |
          echo "storeFile=" > keystore.properties
          echo "storePassword=" >> keystore.properties
          echo "keyAlias=" >> keystore.properties
          echo "keyPassword=" >> keystore.properties
          cat keystore.properties
      - name: Build Debug
        run: ./gradlew app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Camera-debug
          path: app/build/outputs/apk/debug/app-debug.apk